name: Offline Paper Trading
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select simulation or Purchase Now (paper request only)"
        required: true
        type: choice
        default: simulate
        options:
          - simulate
          - purchase_now
          - alpaca_paper_buy
          - alpaca_live_buy
      symbol:
        description: "Uppercase ticker for purchase request (e.g. SPY)"
        required: false
        type: string
      confirmation:
        description: "For Alpaca live only: type I AUTHORIZE LIVE BUY"
        required: false
        type: string
      notional_usd:
        description: "Demo purchase amount in USD (greater than 0, maximum 200)"
        required: false
        type: string
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
permissions:
  contents: read
concurrency:
  group: offline-paper-trading
  cancel-in-progress: false
jobs:
  alpaca-purchase:
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'alpaca_paper_buy' || inputs.action == 'alpaca_live_buy')
    environment: broker-purchase-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Submit explicitly authorized Alpaca order
        env:
          ALPACA_LIVE_TRADING_ENABLED: ${{ vars.ALPACA_LIVE_TRADING_ENABLED }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          LIVE_PURCHASE_CONFIRMATION: ${{ inputs.confirmation }}
          PURCHASE_SYMBOL: ${{ inputs.symbol }}
          PURCHASE_NOTIONAL: ${{ inputs.notional_usd }}
          PURCHASE_MODE: ${{ inputs.action }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$PURCHASE_MODE" = "alpaca_live_buy" ]; then MODE=live; else MODE=paper; fi
          python alpaca_purchase.py --mode "$MODE" --symbol "$PURCHASE_SYMBOL" --notional "$PURCHASE_NOTIONAL" --request-id "hedgeops-$RUN_ID-$RUN_ATTEMPT" > broker-order-result.json
      - name: Upload broker acknowledgement
        uses: actions/upload-artifact@v7
        with:
          name: alpaca-broker-order-acknowledgement
          path: broker-order-result.json
          retention-days: 7
          if-no-files-found: error
  purchase-now:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'purchase_now'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare paper-only purchase request
        env:
          PURCHASE_SYMBOL: ${{ inputs.symbol }}
          PURCHASE_NOTIONAL: ${{ inputs.notional_usd }}
        run: |
          python purchase_now.py --symbol "$PURCHASE_SYMBOL" --notional "$PURCHASE_NOTIONAL" --output purchase-request.json
      - name: Upload request for human review
        uses: actions/upload-artifact@v7
        with:
          name: purchase-now-paper-request
          path: purchase-request.json
          retention-days: 7
          if-no-files-found: error
  paper-trading:
    if: github.event_name == 'schedule' || inputs.action == 'simulate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Pacific schedule
        id: pacific
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "0 16 * * *" ] && [ "$(TZ=America/Los_Angeles date -d '16:00 UTC' +%H)" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "0 17 * * *" ] && [ "$(TZ=America/Los_Angeles date -d '17:00 UTC' +%H)" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.pacific.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        if: steps.pacific.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run offline $200 simulation
        if: steps.pacific.outputs.run == 'true'
        run: python paper_trader.py --demo --capital 200 > paper-trading-results.txt
      - name: Save simulation
        if: steps.pacific.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: paper-trading-results
          path: paper-trading-results.txt
          retention-days: 7
          if-no-files-found: error
