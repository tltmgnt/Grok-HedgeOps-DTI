name: Offline Paper Trading
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
permissions:
  contents: read
concurrency:
  group: offline-paper-trading
  cancel-in-progress: false
jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Pacific schedule
        id: pacific
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "0 16 * * *" ] && [ "$(TZ=America/Los_Angeles date -d '16:00 UTC' +%H)" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "0 17 * * *" ] && [ "$(TZ=America/Los_Angeles date -d '17:00 UTC' +%H)" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.pacific.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        if: steps.pacific.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline $200 simulation
        if: steps.pacific.outputs.run == 'true'
        run: python paper_trader.py --demo --capital 200 > paper-trading-results.txt
      - name: Save simulation
        if: steps.pacific.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: paper-trading-results
          path: paper-trading-results.txt
          retention-days: 7
          if-no-files-found: error
