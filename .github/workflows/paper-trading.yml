name: Offline Paper Trading
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select offline simulation, paper request, or approved paper order"
        required: true
        type: choice
        default: simulate
        options:
          - simulate
          - purchase_now
          - alpaca_paper_buy
      symbol:
        description: "Uppercase ticker for purchase request (e.g. SPY)"
        required: false
        type: string
      notional_usd:
        description: "Demo purchase amount in USD (greater than 0, maximum 200)"
        required: false
        type: string
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
permissions:
  contents: read
concurrency:
  group: offline-paper-trading
  cancel-in-progress: false
jobs:
  alpaca-purchase:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'alpaca_paper_buy'
    environment: broker-purchase-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Submit approved Alpaca paper order
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          PURCHASE_SYMBOL: ${{ inputs.symbol }}
          PURCHASE_NOTIONAL: ${{ inputs.notional_usd }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python alpaca_purchase.py --mode paper --symbol "$PURCHASE_SYMBOL" --notional "$PURCHASE_NOTIONAL" --request-id "hedgeops-$RUN_ID" > broker-order-result.json
      - name: Upload broker acknowledgement
        uses: actions/upload-artifact@v7
        with:
          name: alpaca-broker-order-acknowledgement
          path: broker-order-result.json
          retention-days: 7
          if-no-files-found: error
  purchase-now:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'purchase_now'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare paper-only purchase request
        env:
          PURCHASE_SYMBOL: ${{ inputs.symbol }}
          PURCHASE_NOTIONAL: ${{ inputs.notional_usd }}
        run: |
          python purchase_now.py --symbol "$PURCHASE_SYMBOL" --notional "$PURCHASE_NOTIONAL" --output purchase-request.json
      - name: Upload request for human review
        uses: actions/upload-artifact@v7
        with:
          name: purchase-now-paper-request
          path: purchase-request.json
          retention-days: 7
          if-no-files-found: error
  paper-trading:
    if: github.event_name == 'schedule' || inputs.action == 'simulate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Pacific schedule and report decision
        id: pacific
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/offline_schedule.py --event "$EVENT_NAME" --cron "$SCHEDULE" --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - name: Run offline $200 simulation
        if: steps.pacific.outputs.run == 'true'
        run: |
          python paper_trader.py --demo --capital 200 --json-out paper-trading-results.json > paper-trading-results.txt
          test -s paper-trading-results.txt
          test -s paper-trading-results.json
          python -c 'import json; r=json.load(open("paper-trading-results.json")); assert r["starting"] == 200; assert r["observations"] > 0'
          echo "### Simulation completed" >> "$GITHUB_STEP_SUMMARY"
          echo "Offline $200 simulation generated validated text and JSON results." >> "$GITHUB_STEP_SUMMARY"
      - name: Save simulation
        if: steps.pacific.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: paper-trading-results
          path: |
            paper-trading-results.txt
            paper-trading-results.json
          retention-days: 7
          if-no-files-found: error
