name: Alpaca Paper API Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-paper-account:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify paper account (read-only)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ.get("ALPACA_API_KEY", "")
          secret = os.environ.get("ALPACA_API_SECRET", "")
          if not key or not secret:
              raise SystemExit("Missing ALPACA_API_KEY or ALPACA_API_SECRET repository secret")

          url = "https://paper-api.alpaca.markets/v2/account"
          request = urllib.request.Request(
              url,
              headers={
                  "APCA-API-KEY-ID": key,
                  "APCA-API-SECRET-KEY": secret,
                  "Accept": "application/json",
              },
              method="GET",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  account = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Alpaca paper account check failed (HTTP {exc.code})") from None
          except urllib.error.URLError:
              raise SystemExit("Unable to reach Alpaca paper API") from None

          if not isinstance(account, dict) or not account.get("id"):
              raise SystemExit("Unexpected Alpaca account response")

          print("Alpaca paper API connection successful (read-only).")
          print("Account status:", account.get("status", "unknown"))
          print("No orders were submitted.")
          PY
