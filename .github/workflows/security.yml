name: Static security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install security scanner
        run: python -m pip install 'bandit>=1.7,<2'
      - name: Scan Python sources
        run: python -m bandit -r . -x ./tests,./.venv -ll
