name: Static security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install security scanner
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - name: Scan Python sources
        run: python -m bandit -r . -x ./tests,./.venv -ll

  public-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Check public publication boundary
        run: python scripts/check_public_boundary.py --history
