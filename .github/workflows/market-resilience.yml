name: Offline market resilience research
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  market-research:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p 'test_market_resilience*.py' -v
      - name: Exercise portable bundle and review CLI
        run: |
          python -c "import json; from market_resilience_model import evaluate; s=json.load(open('examples/market_resilience/study.json')); json.dump({'study':s,'report':evaluate(s)},open('/tmp/market-bundle.json','w'))"
          python market_resilience_review.py /tmp/market-bundle.json --output /tmp/market-review.json
