name: Paper Research Agent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-opportunity-intelligence.yml'
      - 'autonomous_paper_session.py'
      - 'paper_opportunity_intelligence.py'
      - 'paper_research_agent.py'
      - 'paper_research_worker.py'
      - 'postgres_paper_ledger.py'
      - 'paper_regime_controls.py'
  workflow_dispatch:
    inputs:
      monitor_only:
        description: 'Read-only rehearsal (no orders)'
        type: boolean
        default: true
  schedule:
    # Includes both DST offsets; broker clock skips closed markets/holidays.
    # Actions can be delayed. This is periodic monitoring, not a streaming daemon.
    - cron: '17,47 13-21 * * 1-5'

permissions:
  contents: read

concurrency:
  group: paper-opportunity-auto-trader
  cancel-in-progress: false

jobs:
  paper-session:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: paper-trading
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - name: Install pinned PAPER database and signature verification drivers
        # Review hash-lock integration before activating trading in production.
        run: python -m pip install --only-binary=:all: 'psycopg[binary]==3.2.12' 'cryptography==50.0.2'
      - name: Validate experiment before broker access
        run: python -m pytest tests/ -q
      - name: Stage protected regime evidence for explicitly authorized manual PAPER run
        if: github.event_name == 'workflow_dispatch' && inputs.monitor_only == false
        env:
          PAPER_REGIME_EVIDENCE_JSON_B64: ${{ secrets.PAPER_REGIME_EVIDENCE_JSON_B64 }}
        run: |
          python - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path
          import sys

          encoded = os.environ.get("PAPER_REGIME_EVIDENCE_JSON_B64", "")
          if not encoded:
              sys.exit("Protected, signed PAPER regime evidence missing")
          try:
              raw = base64.b64decode(encoded, validate=True)
          except (ValueError, binascii.Error):
              sys.exit("Invalid protected regime evidence encoding")
          if not 1 <= len(raw) <= 16384:
              sys.exit("Invalid protected regime evidence size")
          destination = Path(os.environ["RUNNER_TEMP"]) / "paper-regime-evidence.json"
          destination.write_bytes(raw)
          destination.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("PAPER_REGIME_EVIDENCE_FILE=" + str(destination) + "\n")
          PY
      - name: Run paper research agent
        env:
          # Dedicated paper environment secrets used by the existing manual workflow.
          ALPACA_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
          PAPER_LEDGER_DATABASE_URL: ${{ secrets.PAPER_LEDGER_DATABASE_URL }}
          # Default DISABLED. Only explicit protected environment opt-in can submit.
          PAPER_AUTO_TRADING_ENABLED: ${{ vars.PAPER_AUTO_TRADING_ENABLED || 'false' }}
          PAPER_AUTO_KILL_SWITCH: ${{ vars.PAPER_AUTO_KILL_SWITCH || 'true' }}
          PAPER_BROKER_EXECUTION_APPROVED: ${{ vars.PAPER_BROKER_EXECUTION_APPROVED || 'false' }}
          PAPER_REGIME_CONTROL_ENABLED: ${{ vars.PAPER_REGIME_CONTROL_ENABLED || 'true' }}
          PAPER_REGIME_REVIEW_APPROVED: ${{ vars.PAPER_REGIME_REVIEW_APPROVED || 'false' }}
          PAPER_REGIME_APPROVED_SHA256: ${{ vars.PAPER_REGIME_APPROVED_SHA256 }}
          PAPER_REGIME_APPROVAL_EXPIRES_AT: ${{ vars.PAPER_REGIME_APPROVAL_EXPIRES_AT }}
          PAPER_REGIME_APPROVAL_PUBLIC_KEY: ${{ vars.PAPER_REGIME_APPROVAL_PUBLIC_KEY }}
          PAPER_REGIME_APPROVAL_PUBLIC_KEY_SHA256: ${{ vars.PAPER_REGIME_APPROVAL_PUBLIC_KEY_SHA256 }}
          PAPER_REGIME_APPROVAL_SIGNATURE: ${{ vars.PAPER_REGIME_APPROVAL_SIGNATURE }}
          PAPER_ALLOCATION_MODE: legacy
          PAPER_MULTI_ORDER_RUN: 'false'
          PAPER_REQUIRE_FRESH_QUOTE: 'true'
          PAPER_DATA_FEED: ${{ vars.PAPER_DATA_FEED || 'iex' }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
          PAPER_AGENT_REVIEW_MODE: ${{ vars.PAPER_AGENT_REVIEW_MODE || 'auto' }}
          MONITOR_ONLY: ${{ github.event_name != 'workflow_dispatch' || inputs.monitor_only }}
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_API_SECRET" ]; then
            echo "::error::Missing paper credentials: configure ALPACA_PAPER_API_KEY and ALPACA_PAPER_API_SECRET in the paper-trading environment or repository secrets."
          fi
          # Schedule and push are always observation-only; never send broker POST.
          if [ "$MONITOR_ONLY" = true ]; then
            python paper_research_agent.py --monitor-only
          else
            # A manual dispatch alone is insufficient to enable orders.
            if [ "$PAPER_BROKER_EXECUTION_APPROVED" != true ] ||
               [ "$PAPER_AUTO_TRADING_ENABLED" != true ] ||
               [ "$PAPER_AUTO_KILL_SWITCH" != false ] ||
               [ "$PAPER_REGIME_CONTROL_ENABLED" != true ] ||
               [ -z "$PAPER_LEDGER_DATABASE_URL" ]; then
              echo "::error::PAPER execution approvals, ledger, or active regime gate unavailable."
              exit 1
            fi
            python paper_research_agent.py
          fi
      - name: Publish experiment status
        if: always()
        run: |
          if [ -f paper-session-output/summary.md ]; then
            cat paper-session-output/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Paper session failed before broker assessment; inspect job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve experiment evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: paper-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: paper-session-output/
          retention-days: 90
          if-no-files-found: warn
