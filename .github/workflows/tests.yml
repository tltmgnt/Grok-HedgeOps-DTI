name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies and test tooling
        run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Run pytest suite
        run: python -m pytest tests/ -q
      - name: Run offline tests
        run: python release_check.py --verbose
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit installed production dependencies
        run: |
          python -m pip install -r requirements.txt 'pip-audit>=2.7,<3'
          python -m pip_audit
