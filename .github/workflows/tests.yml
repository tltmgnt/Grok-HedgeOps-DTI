name: Python tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests with preserved output
        shell: bash
        run: |
          set -o pipefail
          python release_check.py --verbose 2>&1 | tee "test-output-${{ matrix.python-version }}.log"
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-python-${{ matrix.python-version }}
          path: test-output-${{ matrix.python-version }}.log
          if-no-files-found: warn
          retention-days: 14
