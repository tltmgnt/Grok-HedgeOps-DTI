name: Paper Opportunity Offline Dry Run (No Orders)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-fixture-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No Alpaca credentials and no trading-enable repository variables are passed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Run no-network fixture decision rehearsal
        run: python offline_paper_opportunity_dry_run.py
      - name: Publish simulation summary
        run: cat offline-dry-run-output/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: offline-paper-opportunity-dry-run
          path: offline-dry-run-output/
          retention-days: 14
