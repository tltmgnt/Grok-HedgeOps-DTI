name: Options Ledger PostgreSQL Integration
on:
  push:
    branches: [hardening/postgres-paper-ledger]
    paths:
      - 'migrations/20261110_options_intent_ledger.sql'
      - 'tests/test_options_ledger_postgres.py'
      - '.github/workflows/options-ledger-postgres.yml'
  pull_request:
    paths:
      - 'migrations/20261110_options_intent_ledger.sql'
      - 'tests/test_options_ledger_postgres.py'
      - '.github/workflows/options-ledger-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  options-ledger-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: options_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d options_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPTIONS_TEST_DATABASE_URL: postgresql://postgres:test_only_password@localhost:5432/options_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install PostgreSQL test driver
        run: python -m pip install 'psycopg[binary]==3.2.13'
      - name: Run database-backed options ledger tests
        run: python -m unittest discover -s tests -p 'test_options_ledger_postgres.py' -v
