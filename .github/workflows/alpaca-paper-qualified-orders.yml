name: Alpaca Qualified Paper Orders
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Type I AUTHORIZE PAPER ORDERS'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: paper-opportunity-auto-trader
  cancel-in-progress: false
jobs:
  paper-orders:
    if: ${{ inputs.authorization == 'I AUTHORIZE PAPER ORDERS' }}
    runs-on: ubuntu-latest
    environment: paper-order-approval
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate fresh market snapshot and qualify
        env:
          SNAPSHOT_JSON: ${{ vars.PAPER_MARKET_SNAPSHOT_JSON }}
        run: |
          test -n "$SNAPSHOT_JSON" || { echo "NO ORDERS: missing snapshot" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          printf '%s' "$SNAPSHOT_JSON" > /tmp/paper-market-snapshot.json
          python trade_qualification.py --input /tmp/paper-market-snapshot.json --output /tmp/trade-decisions.json
      - name: Require deployment readiness
        env:
          DEPLOYMENT_READY: ${{ vars.PAPER_ORDER_DEPLOYMENT_READY }}
        run: |
          if [ "$DEPLOYMENT_READY" != "true" ]; then
            echo "NO ORDERS SUBMITTED: deployment not enabled" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Reconcile and report paper orders
        env:
          PAPER_EXECUTION_ENABLED: 'true'
          PAPER_EXECUTION_CONFIRM: ${{ inputs.authorization }}
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_API_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
        run: python paper_order_feedback.py --decisions /tmp/trade-decisions.json
