name: PostgreSQL Paper Ledger Tests
on:
  push:
    branches:
      - hardening/postgres-paper-ledger
  pull_request:
    paths:
      - 'postgres_paper_ledger.py'
      - 'paper_purchase_decision.py'
      - 'tests/test_postgres_paper_ledger.py'
      - '.github/workflows/postgres-paper-ledger-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_only
          POSTGRES_USER: ledger_test
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger_test -d ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Check Python syntax before integration tests
        run: python -m py_compile postgres_paper_ledger.py tests/test_postgres_paper_ledger.py
      - name: Install test driver
        run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Run restart and real PostgreSQL concurrency tests
        env:
          TEST_PAPER_LEDGER_DATABASE_URL: postgresql://ledger_test:test_only@localhost:5432/ledger_test
        run: |
          python -m unittest discover -s tests -p 'test_postgres_paper_ledger.py' -v
          python -m unittest discover -s tests -p 'test_paper_purchase_decision.py' -v
