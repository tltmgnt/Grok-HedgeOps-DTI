name: MathOS X bounded discovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'mathosx/**'
      - 'tests/test_mathosx_discovery.py'
      - '.github/workflows/mathosx-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test exact bounded mathematical probes and feedback guardrails
        run: python -m unittest discover -s tests -p 'test_mathosx_discovery.py' -v
      - name: Generate reproducible unverified research questions
        run: python -m mathosx.discovery --limit 16 --output-dir artifacts/mathosx > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: mathosx-discovery-report
          path: artifacts/mathosx/discovery_report.json
          retention-days: 14
