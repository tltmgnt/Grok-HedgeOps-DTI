name: MathOS X finite theorem prover CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'mathosx/**'
      - 'tests/test_mathosx_autonomy.py'
      - '.github/workflows/mathosx-prover-ci.yml'
      - '.github/workflows/mathosx-code-proposals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-prover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute isolated proof and novelty-scope regression tests
        run: python -m unittest discover -s tests -p 'test_mathosx_autonomy.py' -v
      - name: Search bounded consequences and produce review artifact
        run: python -m mathosx.autonomy --output-dir artifacts/mathosx-autonomous
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: finite-prover-${{ matrix.python-version }}
          path: artifacts/mathosx-autonomous/autonomous_proof_report.json
          retention-days: 14
