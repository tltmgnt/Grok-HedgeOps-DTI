name: Alpaca Paper Trading Read-Only Preflight

on:
  workflow_dispatch:
  schedule:
    - cron: '15 15 * * 1-5'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Test paper safety contracts without credentials
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
          python -m pytest tests/test_paper_opportunity_intelligence.py tests/test_paper_broker_reconciliation.py -q
          python offline_paper_opportunity_dry_run.py
      - name: Confirm no order-submission flags are enabled
        env:
          PAPER_AUTO_TRADING_ENABLED: 'false'
          PAPER_AUTO_KILL_SWITCH: 'true'
        run: |
          test "$PAPER_AUTO_TRADING_ENABLED" = false
          test "$PAPER_AUTO_KILL_SWITCH" = true
          echo 'PASS: Read-only preflight. No broker credentials, no network broker access, no orders.'
