name: Daily Stock Discovery (Read Only)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'

permissions:
  contents: read

concurrency:
  group: daily-stock-discovery
  cancel-in-progress: false

jobs:
  scan:
    name: Scan predefined watchlist (GET only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: paper-trading
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Run read-only stock discovery
        env:
          PAPER_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          PAPER_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          if [[ -n "$PAPER_KEY" || -n "$PAPER_SECRET" ]]; then
            if [[ -z "$PAPER_KEY" || -z "$PAPER_SECRET" ]]; then
              echo "::error::Configure both ALPACA_PAPER_API_KEY and ALPACA_PAPER_API_SECRET in the paper-trading environment."
              exit 1
            fi
            export ALPACA_API_KEY="$PAPER_KEY" ALPACA_API_SECRET="$PAPER_SECRET"
          fi
          unset PAPER_KEY PAPER_SECRET
          python stock_discovery.py --output-dir stock-discovery-output
      - name: Add watchlist to job summary
        if: success()
        run: cat stock-discovery-output/watchlist.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload watchlist report
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daily-stock-discovery-watchlist
          path: stock-discovery-output/
          retention-days: 14
          if-no-files-found: error
