name: Daily Stock Discovery (Read Only)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 1-5'

permissions:
  contents: read

concurrency:
  group: daily-stock-discovery
  cancel-in-progress: false

jobs:
  scan:
    name: Scan predefined watchlist (GET only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only stock discovery
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python stock_discovery.py --output-dir stock-discovery-output
      - name: Add watchlist to job summary
        if: success()
        run: cat stock-discovery-output/watchlist.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload watchlist report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daily-stock-discovery-watchlist
          path: stock-discovery-output/
          retention-days: 14
          if-no-files-found: error
