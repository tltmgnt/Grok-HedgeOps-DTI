name: Alpaca Paper Opportunity Orders (Explicit Opt-In)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SUBMIT PAPER ORDERS to authorize simulated Alpaca paper orders'
        required: true
        type: string
      kill_switch:
        description: 'Emergency kill switch (true prevents submissions)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: paper-opportunity-auto-trader
  cancel-in-progress: false

jobs:
  paper-orders:
    if: ${{ inputs.confirm == 'SUBMIT PAPER ORDERS' && inputs.kill_switch == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: paper-trading
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Validate tests before broker access
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
          python -m pytest tests -q
          python offline_paper_opportunity_dry_run.py
      - name: Submit at most one bounded Alpaca paper order
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_PAPER_API_SECRET }}
          PAPER_AUTO_TRADING_ENABLED: 'true'
          PAPER_AUTO_KILL_SWITCH: 'false'
          PAPER_ALLOCATION_MODE: legacy
          PAPER_MULTI_ORDER_RUN: 'false'
        run: |
          test -n "$ALPACA_API_KEY" && test -n "$ALPACA_API_SECRET" || { echo 'Missing paper-only credentials'; exit 1; }
          python paper_opportunity_intelligence.py --output-dir paper-order-evidence
      - name: Upload decision and reconciliation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: alpaca-paper-order-decision
          path: paper-order-evidence/
          if-no-files-found: ignore
